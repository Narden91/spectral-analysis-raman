# ---------------------------------------------------------------------------
# Plotting profile - single source of truth for plot-owned sections.
# ---------------------------------------------------------------------------
# Inherits the project defaults from settings.yaml and enables the full plotting
# workflow: QC diagnostics plus all spectral comparison modes.
#
# Use with:
#   uv run scripts/run_spectral_plots.py --config config/plots.yaml
# ---------------------------------------------------------------------------
_extends: settings.yaml

plotting:
  # list[str]: spectral ranges to plot, subset of {"1300", "2850"}
  regions: ["1300", "2850"]
  global: true  # bool: also plot global across-range spectra
  gap_cm: 50.0  # float: visual gap between concatenated regions in cm^-1
  axis:
    major_tick: 200.0  # float: cm^-1 spacing for major x-axis ticks
    minor_tick: 50.0  # float: cm^-1 spacing for minor x-axis ticks
  peak_detection:
    enabled: true  # bool: annotate detected peaks
    prominence: 0.05  # float: minimum normalized peak prominence
    distance: 10  # int: minimum channel separation between peaks
    max_peaks: 12  # int: maximum peaks labeled per spectrum
  raman_band_style:
    enabled: true  # category-coloured windows on aggregate spectra only
    alpha: 0.25
  modes:
    condition:
      enabled: true  # bool: plot group/condition comparison
    condition_by_gender:
      enabled: true  # bool: plot condition split by sex
      genders: ["female", "male"]  # list[str]: gender values to include
    individual:
      enabled: true  # bool: plot each subject individually
      line_alpha: 0.25  # float: per-subject line opacity, 0 <= x <= 1
      mean_linewidth: 2.5  # float: mean-spectrum line width
  qc:
    enabled: true  # bool: emit QC diagnostic plots
    metrics:
      # list[str]: QC metrics to summarize
      - snr
      - cosmic_spike_count
      - saturation_fraction
      - baseline_fraction
      - fraction_corrected
    band_images:
      enabled: false  # bool: render per-band intensity images
  n_top_for_ratios: 6  # int: top peaks used for ratio plots
  canonical_bin_width: 5  # int: cm^-1 bin width for peak binning
