# ---------------------------------------------------------------------------
# Fast disease-only EDA profile for development/smoke runs.
#
# This keeps the disease-only phase graph intact but lowers resampling counts
# and CV burden so "Starting disease-only cross-region phases" is quick enough
# for iteration. Do not use this profile for final scientific outputs.
# ---------------------------------------------------------------------------
_extends: eda_disease_only.yaml

analysis:
  disease_stratification:
    n_permutations: 64
    n_jobs: -1
  clinical_correlation_matrix:
    n_permutations: 64
    n_jobs: -1
  longitudinal_moca:
    n_permutations: 64
    n_jobs: -1
  pls_regression:
    n_cv_splits: 3
    n_permutations: 64
    n_jobs: -1
  splsda:
    n_outer_splits: 3
    n_inner_splits: 2
    n_permutations: 32
    n_jobs: -1
  preregistered_panel:
    n_permutations: 64
    n_bootstrap: 128
    n_jobs: -1
  minimal_panel:
    n_outer_splits: 3
    n_inner_splits: 2
    n_permutations: 64
    n_bootstrap: 64
    n_jobs: -1
  panel_minimal_model:
    n_outer_splits: 3
    n_inner_splits: 2
    n_permutations: 64
    n_bootstrap: 64
    n_jobs: -1
