# ---------------------------------------------------------------------------
# Fast disease-vs-control EDA profile for development/smoke runs.
#
# Keeps the control-vs-disease ML phase graph intact but lowers resampling
# counts and CV repeats so "Starting control-vs-disease ML classification" is
# quick enough for iteration. Do not use this profile for final scientific
# outputs or manuscript numbers.
# ---------------------------------------------------------------------------
_extends: eda_disease_control.yaml

biological_pca:
  measurement_count_sensitivity:
    n_draws: 20

analysis:
  control_vs_disease_ml:
    n_outer_splits: 3
    n_outer_repeats: 2
    n_inner_splits: 2
    n_permutations: 50
    n_bootstrap: 50
    n_jobs: -1
