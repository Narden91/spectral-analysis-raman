# ---------------------------------------------------------------------------
# EDA track configuration - single source of truth for EDA-owned sections.
# ---------------------------------------------------------------------------
# Inherits all defaults from settings.yaml.  Only EDA-relevant sections are
# listed here — edit this file for EDA experiments without touching ML/DL
# settings.  Create a copy (e.g. config/eda_custom.yaml) with
#   _extends: eda.yaml
# to override specific keys for a particular experiment.
#
# Performance notes (disease-only cross-region phases):
# - Resampling-heavy blocks use n_jobs: -1 (all CPU cores) by default.
# - For fast dev iteration (NOT final science), use config/eda_disease_fast.yaml.
# - Phase timing CSV: <eda_root>/00_run_metadata/disease_only_cross_region_phase_timing.csv
# - See README.md, CLAUDE.md, and docs/implementation_plan.md (agent onboarding).
# ---------------------------------------------------------------------------
_extends: settings.yaml

# ---------------------------------------------------------------------------
# Run control — which spectral ranges to process by default
# ---------------------------------------------------------------------------
run:
  # list[str]: subset of {"1300", "2850", "both"}
  ranges: ["1300", "2850", "both"]

# ---------------------------------------------------------------------------
# EDA-owned output persistence toggles
# ---------------------------------------------------------------------------
output:
  keep_preprocessing_artifacts: false  # bool: save per-area QC/manifests during EDA only
  keep_whole_spectra_cache: false  # bool: save paired-area whole-spectrum cache during EDA only

# ---------------------------------------------------------------------------
# Analysis parameters
# ---------------------------------------------------------------------------
analysis:
  mode: "disease_vs_control"  # str: one of {"disease_vs_control", "disease_only"}
  clinical_endpoints:
    enabled: true
    clinical_table: data/clinical_data.csv
    subject_id_col: subject_id
    moca_baseline_col: moca_baseline_total
    moca_3m_col: moca_3m_total
    rbans_col: rbans_total
    age_col: age
    aspects_col: aspects_score
    sex_col: sex
    diagnosis_col: diagnosis_category
    lesion_location_col: lesion_location
    severity_threshold: 20
    decline_threshold: 0
    mild_threshold: 25
    recovery_threshold: 2
  statistical_test: "parametric"  # str: primary "parametric" or sensitivity "non-parametric"
  pca_n_components: 10  # int: number of principal components to compute
  random_state: 42  # int: reproducibility seed
  expected_files_per_subject: 12  # int: expected spectrum files per subject
  noise_sample_subjects: 20  # int: subjects sampled to estimate noise distribution
  normality_subsample_wavenumbers: 100  # int: wavenumber subsample size for normality tests
  io_workers: 12  # int: parallel workers for I/O-bound tasks (<= CPU cores)
  pca:
    top_k_wavenumbers: 20  # int: number of top loading wavenumbers to export
    n_components_exported: 10  # int: number of components to export/plot
  figures:
    emit_group_mean_spectra: true  # bool: plot mean spectra by group
    emit_band_boxplots: false  # bool: plot per-band boxplots (superseded by rainclouds)
    emit_band_rainclouds: true  # bool: plot per-band rainclouds
    emit_cluster_mean_spectra: true  # bool: plot mean spectra per cluster
  region_weighting:
    enabled: true  # bool: apply region masks/weights (exclude CH-stretch silent region ~2670)
    apply_to: ["pca", "robustness"]  # list[str]: affected analyses ["pca", "robustness"]
    exclude_windows: [[2655, 2685]]  # list[list[float]]: hard-exclude silent CH-stretch region (no Raman bands 1800-2700)
    downweight_windows: []  # list[list[float]]: [[start_cm, end_cm, factor], ...]
    # Reviewer concern: PC2 of CH-stretch block driven by ~2670 cm-1 (silent region, noise not biology)
    # Robustness comparison is also enabled to document the effect quantitatively.
  advanced:
    dimred:
      tsne_perplexity: 30  # float: t-SNE perplexity, typically 5-50
      tsne_n_iter: 1000  # int: t-SNE optimization iterations

    intra_disease:
      enabled: false  # bool: per-wavenumber Spearman correlations vs clinical targets, disease subjects only
      clinical_csv: "data/clinical_data.csv"  # str: disease-only curated clinical CSV
    robustness:
      enabled: true  # bool: compare baseline vs region-masked PCA to document silent-region influence on PC2
      suspect_windows: [[2655, 2685]]  # list[list[float]]: regions to downweight/exclude
      downweight_factor: 0.0  # float: 0 = exclude window, >0 = residual weight
  disease_stratification:
    enabled: true  # bool: run disease-internal subject-level stratification from exported whole-spectrum features
    min_subjects_per_group: 10  # int: design floor for exploratory two-group tests
    cluster_alpha: 0.05  # float: uncorrected cluster-forming threshold
    n_permutations: 1000  # int: label permutations for cluster-mass correction
    n_jobs: -1  # int: joblib workers for permutation tests; -1 uses all cores
    random_state: 42  # int: reproducibility seed for permutation testing
    candidate_region_min_width_cm: 8.0  # float: minimum merged region width
    candidate_region_merge_gap_cm: 6.0  # float: maximum within-region gap
    candidate_region_fallback_quantile: 0.9  # float: top-|effect| fallback quantile when no formal hits survive
  clinical_correlation_matrix:
    enabled: true  # bool: run disease-only feature-clinical discovery on whole-spectrum subject features
    targets: [moca_baseline, moca_3m, delta_moca, rbans_total, age, aspects_score]
    min_subjects: 20  # int: minimum subjects with non-missing endpoint values
    fdr_alpha: 0.05  # float: BH-FDR significance threshold
    cluster_alpha: 0.05  # float: uncorrected cluster-forming threshold
    n_permutations: 1000  # int: target permutations for cluster-mass correction
    n_jobs: -1  # int: joblib workers for permutation tests; -1 uses all cores
    random_state: 42  # int: reproducibility seed for permutation testing
    candidate_region_min_width_cm: 8.0  # float: minimum merged region width
    candidate_region_merge_gap_cm: 6.0  # float: maximum within-region gap
    candidate_region_fallback_quantile: 0.9  # float: top-|effect| fallback quantile when no formal hits survive
  longitudinal_moca:
    enabled: true  # bool: run disease-only longitudinal Delta MoCA feature associations
    min_subjects: 20  # int: minimum subjects per model after endpoint/group filtering
    fdr_alpha: 0.05  # float: BH-FDR significance threshold
    cluster_alpha: 0.05  # float: uncorrected cluster-forming threshold
    n_permutations: 1000  # int: permutations for cluster-mass correction
    n_jobs: -1  # int: joblib workers for permutation tests; -1 uses all cores
    random_state: 42  # int: reproducibility seed for permutation testing
    candidate_region_min_width_cm: 8.0  # float: minimum merged region width
    candidate_region_merge_gap_cm: 6.0  # float: maximum within-region gap
    candidate_region_fallback_quantile: 0.9  # float: top-|effect| fallback quantile when no formal hits survive
    top_scatterplot_regions: 5  # int: number of candidate regions to visualize
  candidate_regions:
    enabled: true  # bool: unify phase-6 candidate regions into one cross-analysis table
  covariate_models:
    enabled: true  # bool: run covariate-adjusted models on candidate regions and configured ratios
    covariates: [age, sex]
    min_subjects: 30  # int: lower bound; design-aware parameter/event rules are stricter
    random_state: 42  # int: reproducibility seed for deterministic logistic fits
  whole_spectra:
    emit_mfa: false  # bool: write MFA to whole_spectra/exploratory_multiblock/MFA/
  pls_regression:
    enabled: true
    targets: [moca_baseline, moca_3m, delta_moca]
    component_grid: [1, 2, 3, 4, 5]
    max_components: 5
    tune_components_inside_cv: true
    n_cv_splits: 5       # used when n >= 15; LOO when n < 15
    min_subjects: 10
    vip_threshold: 1.0
    n_permutations: 1000
    permutation_family_alpha: 0.05  # Holm correction across configured continuous endpoints
    n_jobs: -1
    random_state: 42
  splsda:
    enabled: true
    gate_on_pls_p_value: 0.05
    targets:
      - group_variable: moca_severity_group
        ordered_groups: [low_moca, high_moca]
        label: "cognitive-severity classifier"
      - group_variable: delta_moca_group
        ordered_groups: [decline, stable_or_improved]
        label: "disease-trajectory classifier"
    component_grid: [1, 2, 3, 4, 5]
    c_range: [0.01, 0.1, 1.0, 10.0]
    n_outer_splits: 5
    n_inner_splits: 3
    min_subjects_per_group: 10
    min_subjects_continuous: 20
    n_permutations: 500
    n_jobs: -1
    random_state: 42
    emit_oplsda: false
  biochemical_ratios:
    enabled: true
    targets: [moca_baseline, moca_3m, delta_moca]
    min_subjects: 20
    fdr_alpha: 0.05
  integrated_candidates:
    enabled: true
    vip_threshold: 1.0
  disease_subgroups:
    enabled: true
    min_subjects: 10
    min_clusters: 2
    max_clusters: 4
    n_bootstrap: 100
    random_state: 42
  panel_cluster_summary:
    enabled: true
    endpoints: [moca_baseline, moca_3m, delta_moca]
  minimal_panel:
    enabled: true
    max_features: 10
    min_features: 5
    n_outer_splits: 5
    n_inner_splits: 3
    n_permutations: 1000
    n_bootstrap: 200
    n_jobs: -1
    detect_gpu: true
    random_state: 42
    continuous_targets: [moca_baseline, moca_3m, delta_moca]
    binary_targets:
      - group_variable: moca_severity_group
        ordered_groups: [low_moca, high_moca]
      - group_variable: delta_moca_group
        ordered_groups: [decline, stable_or_improved]
    vip_threshold: 1.0
    require_pls_gate: true
    feature_source: candidate_regions
  panel_minimal_model:
    enabled: true
    feature_source: preregistered_panel
    max_features: 5
    min_features: 3
  endpoint_consistency:
    enabled: true
  robustness_ranking:
    enabled: true
  panel_report:
    enabled: true
  publication_report:
    enabled: true
    robust_requires:
      - fdr_significant
      - cluster_permutation
      - covariate_persisted

  # ---------------------------------------------------------------------------
  # Control-vs-disease ML classification (disease_vs_control mode only).
  # Writes to Results_control_vs_disease/05_ml_classification/. Full-resampling
  # defaults below; use
  # config/eda_disease_control_fast.yaml for iteration, not final science.
  # ---------------------------------------------------------------------------
  control_vs_disease_ml:
    enabled: true
    representations: ["whole", "band_panel"]
    primary_model: "pls_da"            # pre-specified; all others secondary
    primary_representation: "whole"
    n_outer_splits: 5
    n_outer_repeats: 10
    n_inner_splits: 4
    n_permutations: 1000
    n_bootstrap: 1000
    importance_permutation_repeats: 5  # RF held-out outer-fold permutation importance
    threshold_metric: "balanced_accuracy"
    stratify_permutation_by: "sex"
    random_state: 42
    n_jobs: -1
    pls_components_grid: [1, 2, 3, 4, 5, 6, 8, 10]
    logistic_c_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
    rf_n_estimators_grid: [200, 500]
    rf_max_depth_grid: [null, 4, 8]

  # ---------------------------------------------------------------------------
  # Tier-2 — Structure-aware spectral interpretability (Phases M–U)
  # All phases write to Results_intra_disease/06_spectral_interpretability/<phase>/
  # ---------------------------------------------------------------------------

  spectral_shape:
    # Phase M: per-subject Gaussian peak fit (centroid / FWHM / asymmetry)
    # on provenance-aware fixed-panel band windows; Spearman associations with endpoints.
    # Parameters are inherited from preregistered_panel (min_snr_for_peak_fit,
    # calibration_floor_cm, n_bootstrap, peak_shape_windows, covariates).
    enabled: true

  nmf_decomposition:
    # Phase N: NMF latent components of the fingerprint region.
    # NMF hyper-parameters (n_components, sparsity_alpha, n_init, apply_to)
    # live under preregistered_panel.nmf in this file.
    enabled: true

  spectral_descriptors:
    # Phase O: Shannon entropy and Gini dispersion per subject over the
    # fingerprint block (1300__* columns). Endpoint Spearman associations
    # use preregistered_panel endpoints / covariates.
    enabled: true

  discriminant_spectra:
    # Phase P: mean-group difference spectra + signed Cohen's-d effect maps
    # for each contrast defined in preregistered_panel.endpoints.contrasts.
    enabled: true

  feature_coupling:
    # Phase Q: pairwise Spearman coupling matrix + bootstrap CIs across the
    # fixed-panel indices/integrals; ratio-ratio spectral regime map.
    enabled: true
    n_bootstrap: 500  # int: bootstrap replicates for coupling CI estimation
    random_state: 42  # int: reproducibility seed

  index_clustering:
    # Phase R: agglomerative Ward clustering of panel indices; Gap-statistic
    # k selection; bootstrap ARI stability. Disabled by default — opt-in only.
    enabled: false
    max_k: 4        # int: maximum number of clusters to evaluate
    n_gap_refs: 20  # int: null-distribution reference samples for Gap stat
    n_bootstrap: 100  # int: bootstrap ARI replicates
    random_state: 42  # int: reproducibility seed

  journal_figures:
    # Phase U: assembles 5 publication-quality figures from Tier-1/Tier-2
    # outputs for Spectrochimica Acta A submission.
    enabled: true

  preregistered_panel:
    enabled: true
    provenance_type: post_hoc_fixed
    registration_id: null
    registered_at: null
    registration_url: null
    analysis_plan_hash: null
    fdr_alpha: 0.05
    n_permutations: 1000
    n_bootstrap: 2000
    n_jobs: -1
    random_state: 42
    min_subjects_per_group: 10
    min_snr_for_peak_fit: 5.0
    calibration_floor_cm: 1.5
    integrals:
      lipid_carbonyl_1721: ["1300", 1710, 1735]
      lipid_carbonyl_1721_fallback: ["1300", 1700, 1750]
      carotenoid_cc_1156: ["1300", 1145, 1170]
      carotenoid_1525: ["1300", 1510, 1535]
      protein_1555: ["1300", 1540, 1570]
      structural_protein_925: ["1300", 915, 935]
      structural_protein_980: ["1300", 970, 990]
      tyrosine_851: ["1300", 845, 858]
      tyrosine_821: ["1300", 815, 828]
      ch_bulk_2885: ["2850", 2850, 2950]
    indices:
      membrane_integrity_index: [ch_bulk_2885, lipid_carbonyl_1721]
      oxidative_index: [carotenoid_1525, lipid_carbonyl_1721]
      protein_remodeling_index: [protein_1555, structural_protein_925, structural_protein_980]
      tyrosine_environment_index: [tyrosine_851, tyrosine_821]
    primary_hypothesis:
      feature: oxidative_index
      endpoint: delta_moca
      direction: negative
      test: partial_spearman
      covariates: [age, sex]
    robustness:
      effect_size_threshold: 0.147
      perm_p_threshold: 0.10
      min_endpoint_agreement: 2
    endpoints:
      continuous: [moca_baseline, moca_3m, delta_moca]
      contrasts:
        - {name: severity_extreme, group_variable: moca_severity_group_extreme, ordered_groups: [severe, mild]}
        - {name: trajectory_extreme, group_variable: delta_moca_group_extreme, ordered_groups: [decline, recovery]}
    covariates: [age, sex]
    peak_shape_windows:
      lipid_carbonyl_1721: [1710, 1735]
      protein_1555: [1540, 1570]
      carotenoid_1525: [1510, 1535]
    nmf:
      n_components: 3
      sparsity_alpha: 0.1
      n_init: 20
      apply_to: fingerprint

# ---------------------------------------------------------------------------
# Whole-spectra band definitions (EV-specific curation)
# ---------------------------------------------------------------------------
whole_spectra:
  ratio_pairs:
    - [carotenoid_1525, lipid_carbonyl_1721]
    - [amide_i_1657, ch2_sym_stretch_2853]
    - [amide_iii_1258, amide_i_1657]
    - [po2_cn_1112, amide_i_1657]
    - [lipid_ester_1744, ch2_sym_stretch_2853]
    - [carotenoid_1156, carotenoid_1525]
  correlation:
    method: "spearman"  # str: correlation method ("spearman", "pearson", ...)
    n_bootstrap: 200  # int: bootstrap replicates for confidence intervals

# ---------------------------------------------------------------------------
# Subject-level Biological PCA layer
# ---------------------------------------------------------------------------
biological_pca:
  enabled: true
  n_components: 3
  aggregation: "median"
  scale: false
  output_subdir: "biological_pca"
  loading_region_quantile: 0.9
  loading_region_min_width_cm: 8.0
  loading_region_merge_gap_cm: 6.0
  figures:
    emit_convex_hull: false
  models:
    PCA_1330:
      spectral_blocks: ["1300"]
      window: "full"
      bands:
        - cytosine_786
        - o_p_o_821
        - tyrosine_851
        - c_o_c_sugar_925
        - beta_sheet_980
        - c_o_c_n_1060
        - lipid_cc_1089
        - po2_cn_1112
        - carotenoid_1156
        - amide_iii_1258
        - ch2_twist_1301
        - ch2_ch3_scissor_1440
        - ch2_ch3_bend_1465
        - carotenoid_1525
        - tryptophan_1555
        - amide_i_1657
        - lipid_carbonyl_1721
        - lipid_ester_1744
    PCA_2850:
      spectral_blocks: ["2850"]
      window: "full"
      bands:
        - ch2_sym_stretch_2853
        - ch2_asym_stretch_2890
        - ch3_asym_stretch_2937
    PCA_whole:
      spectral_blocks: ["1300", "2850"]
      window: "full"
      bands:
        - cytosine_786
        - o_p_o_821
        - tyrosine_851
        - c_o_c_sugar_925
        - beta_sheet_980
        - c_o_c_n_1060
        - lipid_cc_1089
        - po2_cn_1112
        - carotenoid_1156
        - amide_iii_1258
        - ch2_twist_1301
        - ch2_ch3_scissor_1440
        - ch2_ch3_bend_1465
        - carotenoid_1525
        - tryptophan_1555
        - amide_i_1657
        - lipid_carbonyl_1721
        - lipid_ester_1744
        - ch2_sym_stretch_2853
        - ch2_asym_stretch_2890
        - ch3_asym_stretch_2937
  biochemical_classes:
    lipid:
      - lipid_cc_1089
      - ch2_twist_1301
      - ch2_ch3_scissor_1440
      - ch2_ch3_bend_1465
      - lipid_carbonyl_1721
      - lipid_ester_1744
      - ch2_sym_stretch_2853
      - ch2_asym_stretch_2890
      - ch3_asym_stretch_2937
    protein:
      - tyrosine_851
      - beta_sheet_980
      - c_o_c_n_1060
      - amide_iii_1258
      - tryptophan_1555
      - amide_i_1657
    nucleic_acid:
      - cytosine_786
      - o_p_o_821
      - c_o_c_sugar_925
      - po2_cn_1112
    carotenoid:
      - carotenoid_1156
      - carotenoid_1525
