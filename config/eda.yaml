# ---------------------------------------------------------------------------
# EDA track configuration - single source of truth for EDA-owned sections.
# ---------------------------------------------------------------------------
# Inherits all defaults from settings.yaml.  Only EDA-relevant sections are
# listed here — edit this file for EDA experiments without touching ML/DL
# settings.  Create a copy (e.g. config/eda_custom.yaml) with
#   _extends: eda.yaml
# to override specific keys for a particular experiment.
# ---------------------------------------------------------------------------
_extends: settings.yaml

# ---------------------------------------------------------------------------
# Run control — which spectral ranges to process by default
# ---------------------------------------------------------------------------
run:
  # list[str]: subset of {"1300", "2850", "both"}
  ranges: ["1300", "2850", "both"]

# ---------------------------------------------------------------------------
# EDA-owned output persistence toggles
# ---------------------------------------------------------------------------
output:
  keep_preprocessing_artifacts: false  # bool: save per-area QC/manifests during EDA only
  keep_whole_spectra_cache: false  # bool: save paired-area whole-spectrum cache during EDA only

# ---------------------------------------------------------------------------
# Analysis parameters
# ---------------------------------------------------------------------------
analysis:
  mode: "disease_vs_control"  # str: one of {"disease_vs_control", "disease_only"}
  clinical_endpoints:
    enabled: true
    clinical_table: data/clinical_data.csv
    subject_id_col: subject_id
    moca_baseline_col: moca_baseline_total
    moca_3m_col: moca_3m_total
    rbans_col: rbans_total
    age_col: age
    aspects_col: aspects_score
    sex_col: sex
    diagnosis_col: diagnosis_category
    lesion_location_col: lesion_location
    severity_threshold: 20
    decline_threshold: 0
    mild_threshold: 25
    recovery_threshold: 2
  statistical_test: "auto"  # str: "auto", "parametric", or "non-parametric"
  pca_n_components: 10  # int: number of principal components to compute
  random_state: 42  # int: reproducibility seed
  expected_files_per_subject: 12  # int: expected spectrum files per subject
  noise_sample_subjects: 20  # int: subjects sampled to estimate noise distribution
  normality_subsample_wavenumbers: 100  # int: wavenumber subsample size for normality tests
  io_workers: 12  # int: parallel workers for I/O-bound tasks (<= CPU cores)
  pca:
    top_k_wavenumbers: 20  # int: number of top loading wavenumbers to export
    n_components_exported: 10  # int: number of components to export/plot
  figures:
    emit_group_mean_spectra: true  # bool: plot mean spectra by group
    emit_band_boxplots: false  # bool: plot per-band boxplots (superseded by rainclouds)
    emit_band_rainclouds: true  # bool: plot per-band rainclouds
    emit_cluster_mean_spectra: true  # bool: plot mean spectra per cluster
  region_weighting:
    enabled: false  # bool: apply region masks/weights
    apply_to: ["pca", "robustness"]  # list[str]: affected analyses ["pca", "robustness"]
    exclude_windows: []  # list[list[float]]: [[start_cm, end_cm], ...] to exclude
    downweight_windows: []  # list[list[float]]: [[start_cm, end_cm, factor], ...]
    # Suspect CH-stretch window examples:
    # exclude_windows: [[2655, 2685]]
    # downweight_windows: [[2655, 2685, 0.25]]
  advanced:
    dimred:
      tsne_perplexity: 30  # float: t-SNE perplexity, typically 5-50
      tsne_n_iter: 1000  # int: t-SNE optimization iterations

    intra_disease:
      enabled: false  # bool: per-wavenumber Spearman correlations vs clinical targets, disease subjects only
      clinical_csv: "data/clinical_data.csv"  # str: disease-only curated clinical CSV
    robustness:
      enabled: false  # bool: compare baseline vs region-masked analyses
      suspect_windows: [[2655, 2685]]  # list[list[float]]: regions to downweight/exclude
      downweight_factor: 0.0  # float: 0 = exclude window, >0 = residual weight
  disease_stratification:
    enabled: true  # bool: run disease-internal subject-level stratification from exported whole-spectrum features
    min_subjects_per_group: 5  # int: skip formal testing when any stratum falls below this size
    cluster_alpha: 0.05  # float: uncorrected cluster-forming threshold
    n_permutations: 1000  # int: label permutations for cluster-mass correction
    random_state: 42  # int: reproducibility seed for permutation testing
    candidate_region_min_width_cm: 8.0  # float: minimum merged region width
    candidate_region_merge_gap_cm: 6.0  # float: maximum within-region gap
    candidate_region_fallback_quantile: 0.9  # float: top-|effect| fallback quantile when no formal hits survive
  clinical_correlation_matrix:
    enabled: true  # bool: run disease-only feature-clinical discovery on whole-spectrum subject features
    targets: [moca_baseline, moca_3m, delta_moca, rbans_total, age, aspects_score]
    min_subjects: 5  # int: minimum subjects with non-missing endpoint values
    fdr_alpha: 0.05  # float: BH-FDR significance threshold
    cluster_alpha: 0.05  # float: uncorrected cluster-forming threshold
    n_permutations: 1000  # int: target permutations for cluster-mass correction
    random_state: 42  # int: reproducibility seed for permutation testing
    candidate_region_min_width_cm: 8.0  # float: minimum merged region width
    candidate_region_merge_gap_cm: 6.0  # float: maximum within-region gap
    candidate_region_fallback_quantile: 0.9  # float: top-|effect| fallback quantile when no formal hits survive
  longitudinal_moca:
    enabled: true  # bool: run disease-only longitudinal Delta MoCA feature associations
    min_subjects: 5  # int: minimum subjects per model after endpoint/group filtering
    fdr_alpha: 0.05  # float: BH-FDR significance threshold
    cluster_alpha: 0.05  # float: uncorrected cluster-forming threshold
    n_permutations: 1000  # int: permutations for cluster-mass correction
    random_state: 42  # int: reproducibility seed for permutation testing
    candidate_region_min_width_cm: 8.0  # float: minimum merged region width
    candidate_region_merge_gap_cm: 6.0  # float: maximum within-region gap
    candidate_region_fallback_quantile: 0.9  # float: top-|effect| fallback quantile when no formal hits survive
    top_scatterplot_regions: 5  # int: number of candidate regions to visualize
  candidate_regions:
    enabled: true  # bool: unify phase-6 candidate regions into one cross-analysis table
  covariate_models:
    enabled: true  # bool: run covariate-adjusted models on candidate regions and configured ratios
    covariates: [age, sex]
    min_subjects: 8  # int: minimum complete-case subjects per model
    random_state: 42  # int: reproducibility seed for deterministic logistic fits
  whole_spectra:
    emit_mfa: false  # bool: write MFA to whole_spectra/exploratory_multiblock/MFA/
  pls_regression:
    enabled: true
    targets: [moca_baseline, moca_3m, delta_moca]
    component_grid: [1, 2, 3, 4, 5]
    max_components: 5
    tune_components_inside_cv: true
    n_cv_splits: 5       # used when n >= 15; LOO when n < 15
    min_subjects: 10
    vip_threshold: 1.0
    n_permutations: 1000
    random_state: 42
  splsda:
    enabled: true
    gate_on_pls_p_value: 0.05
    targets:
      - group_variable: moca_severity_group
        ordered_groups: [low_moca, high_moca]
        label: "cognitive-severity classifier"
      - group_variable: delta_moca_group
        ordered_groups: [decline, stable_or_improved]
        label: "disease-trajectory classifier"
    component_grid: [1, 2, 3, 4, 5]
    c_range: [0.01, 0.1, 1.0, 10.0]
    n_outer_splits: 5
    n_inner_splits: 3
    min_subjects_per_group: 3
    n_permutations: 500
    random_state: 42
    emit_oplsda: false
  biochemical_ratios:
    enabled: true
    targets: [moca_baseline, moca_3m, delta_moca]
    min_subjects: 5
    fdr_alpha: 0.05
  integrated_candidates:
    enabled: true
    vip_threshold: 1.0
  disease_subgroups:
    enabled: true
    min_subjects: 10
    min_clusters: 2
    max_clusters: 4
    n_bootstrap: 100
    random_state: 42
  minimal_panel:
    enabled: true
    max_features: 10
    min_features: 5
    n_outer_splits: 5
    n_inner_splits: 3
    n_permutations: 1000
    n_bootstrap: 200
    n_jobs: -1
    detect_gpu: true
    random_state: 42
    continuous_targets: [moca_baseline, moca_3m, delta_moca]
    binary_targets:
      - group_variable: moca_severity_group
        ordered_groups: [low_moca, high_moca]
      - group_variable: delta_moca_group
        ordered_groups: [decline, stable_or_improved]
    vip_threshold: 1.0
    require_pls_gate: true
  publication_report:
    enabled: true
    robust_requires:
      - fdr_significant
      - cluster_permutation
      - covariate_persisted
  preregistered_panel:
    enabled: true
    fdr_alpha: 0.05
    n_permutations: 1000
    n_bootstrap: 2000
    random_state: 42
    min_subjects_per_group: 5
    min_snr_for_peak_fit: 5.0
    calibration_floor_cm: 1.5
    integrals:
      lipid_carbonyl_1720: ["1300", 1710, 1735]
      lipid_carbonyl_1720_fallback: ["1300", 1700, 1750]
      carotenoid_cc_1156: ["1300", 1145, 1170]
      carotenoid_1525: ["1300", 1510, 1535]
      protein_1555: ["1300", 1540, 1570]
      structural_protein_925: ["1300", 915, 935]
      structural_protein_980: ["1300", 970, 990]
      tyrosine_851: ["1300", 845, 858]
      tyrosine_821: ["1300", 815, 828]
      ch_bulk_2885: ["2850", 2850, 2950]
    indices:
      membrane_integrity_index: [ch_bulk_2885, lipid_carbonyl_1720]
      oxidative_index: [carotenoid_1525, lipid_carbonyl_1720]
      protein_remodeling_index: [protein_1555, structural_protein_925, structural_protein_980]
      tyrosine_environment_index: [tyrosine_851, tyrosine_821]
    primary_hypothesis:
      feature: oxidative_index
      endpoint: delta_moca
      direction: negative
      test: partial_spearman
      covariates: [age, sex]
    robustness:
      effect_size_threshold: 0.147
      perm_p_threshold: 0.10
      min_endpoint_agreement: 2
    endpoints:
      continuous: [moca_baseline, moca_3m, delta_moca]
      contrasts:
        - {name: severity_extreme, group_variable: moca_severity_group_extreme, ordered_groups: [severe, mild]}
        - {name: trajectory_extreme, group_variable: delta_moca_group_extreme, ordered_groups: [decline, recovery]}
    covariates: [age, sex]
    peak_shape_windows:
      lipid_carbonyl_1720: [1710, 1735]
      protein_1555: [1540, 1570]
      carotenoid_1525: [1510, 1535]
    nmf:
      n_components: 3
      sparsity_alpha: 0.1
      n_init: 20
      apply_to: fingerprint

# ---------------------------------------------------------------------------
# Whole-spectra band definitions (Movasaghi et al. 2007 + lab curation)
# ---------------------------------------------------------------------------
whole_spectra:
  bands:
    # dict[str, list[float]]: [start_cm, end_cm] integration windows
    phenylalanine_1004: [995, 1015]
    dna_po2_sym_1090: [1080, 1100]
    c_c_skeletal_1127: [1115, 1140]
    amide_iii_1260: [1240, 1280]
    ch2_bend_1300: [1290, 1320]
    ch2_scissor_1450: [1435, 1470]
    carboxylate_1580: [1565, 1595]
    amide_i_1655: [1630, 1680]
    ch2_sym_stretch_2850: [2840, 2865]
    ch2_asym_stretch_2885: [2875, 2900]
    ch3_sym_stretch_2930: [2920, 2945]
    ch3_asym_stretch_2960: [2950, 2975]
    oh_nh_stretch_3060: [3045, 3080]
  ratio_pairs:
    # list[list[str]]: band-name pairs for intensity-ratio calculations
    - [amide_i_1655, ch2_sym_stretch_2850]
    - [amide_i_1655, ch3_sym_stretch_2930]
    - [phenylalanine_1004, ch3_sym_stretch_2930]
    - [dna_po2_sym_1090, ch2_sym_stretch_2850]
    - [amide_iii_1260, amide_i_1655]
    - [ch2_sym_stretch_2850, ch3_sym_stretch_2930]
  correlation:
    method: "spearman"  # str: correlation method ("spearman", "pearson", ...)
    n_bootstrap: 200  # int: bootstrap replicates for confidence intervals

# ---------------------------------------------------------------------------
# Subject-level Biological PCA layer
# ---------------------------------------------------------------------------
biological_pca:
  enabled: true
  n_components: 3
  aggregation: "median"
  scale: false
  output_subdir: "biological_pca"
  loading_region_quantile: 0.9
  loading_region_min_width_cm: 8.0
  loading_region_merge_gap_cm: 6.0
  figures:
    emit_convex_hull: false
  models:
    PCA_1330:
      spectral_blocks: ["1300"]
      window: "full"
      bands:
        - amide_iii_1260
        - ch2_bend_1300
        - ch2_scissor_1450
    PCA_2850:
      spectral_blocks: ["2850"]
      window: "full"
      bands:
        - ch2_sym_stretch_2850
        - ch2_asym_stretch_2885
        - ch3_sym_stretch_2930
        - ch3_asym_stretch_2960
    PCA_whole:
      spectral_blocks: ["1300", "2850"]
      window: "full"
      bands:
        - phenylalanine_1004
        - dna_po2_sym_1090
        - c_c_skeletal_1127
        - amide_iii_1260
        - ch2_bend_1300
        - ch2_scissor_1450
        - carboxylate_1580
        - amide_i_1655
        - ch2_sym_stretch_2850
        - ch2_asym_stretch_2885
        - ch3_sym_stretch_2930
        - ch3_asym_stretch_2960
        - oh_nh_stretch_3060
  biochemical_classes:
    lipid:
      - ch2_bend_1300
      - ch2_scissor_1450
      - ch2_sym_stretch_2850
      - ch2_asym_stretch_2885
    protein:
      - phenylalanine_1004
      - amide_iii_1260
      - amide_i_1655
      - ch3_sym_stretch_2930
      - ch3_asym_stretch_2960
    nucleic_acid:
      - dna_po2_sym_1090
    mixed:
      - c_c_skeletal_1127
      - carboxylate_1580
      - oh_nh_stretch_3060
