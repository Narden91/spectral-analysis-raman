# ---------------------------------------------------------------------------
# EDA track configuration - single source of truth for EDA-owned sections.
# ---------------------------------------------------------------------------
# Inherits all defaults from settings.yaml.  Only EDA-relevant sections are
# listed here — edit this file for EDA experiments without touching ML/DL
# settings.  Create a copy (e.g. config/eda_custom.yaml) with
#   _extends: eda.yaml
# to override specific keys for a particular experiment.
# ---------------------------------------------------------------------------
_extends: settings.yaml

# ---------------------------------------------------------------------------
# Run control — which spectral ranges to process by default
# ---------------------------------------------------------------------------
run:
  # list[str]: subset of {"1300", "2850", "both"}
  ranges: ["1300", "2850", "both"]

# ---------------------------------------------------------------------------
# EDA-owned output persistence toggles
# ---------------------------------------------------------------------------
output:
  keep_preprocessing_artifacts: false  # bool: save per-area QC/manifests during EDA only
  keep_whole_spectra_cache: false  # bool: save paired-area whole-spectrum cache during EDA only

# ---------------------------------------------------------------------------
# Analysis parameters
# ---------------------------------------------------------------------------
analysis:
  statistical_test: "auto"  # str: "auto", "parametric", or "non-parametric"
  pca_n_components: 10  # int: number of principal components to compute
  random_state: 42  # int: reproducibility seed
  expected_files_per_subject: 12  # int: expected spectrum files per subject
  noise_sample_subjects: 20  # int: subjects sampled to estimate noise distribution
  normality_subsample_wavenumbers: 100  # int: wavenumber subsample size for normality tests
  io_workers: 12  # int: parallel workers for I/O-bound tasks (<= CPU cores)
  pca:
    top_k_wavenumbers: 20  # int: number of top loading wavenumbers to export
    n_components_exported: 10  # int: number of components to export/plot
  figures:
    emit_group_mean_spectra: true  # bool: plot mean spectra by group
    emit_band_boxplots: false  # bool: plot per-band boxplots (superseded by rainclouds)
    emit_band_rainclouds: true  # bool: plot per-band rainclouds
    emit_cluster_mean_spectra: true  # bool: plot mean spectra per cluster
  region_weighting:
    enabled: false  # bool: apply region masks/weights
    apply_to: ["pca", "robustness"]  # list[str]: affected analyses ["pca", "robustness"]
    exclude_windows: []  # list[list[float]]: [[start_cm, end_cm], ...] to exclude
    downweight_windows: []  # list[list[float]]: [[start_cm, end_cm, factor], ...]
    # Suspect CH-stretch window examples:
    # exclude_windows: [[2655, 2685]]
    # downweight_windows: [[2655, 2685, 0.25]]
  advanced:
    dimred:
      tsne_perplexity: 30  # float: t-SNE perplexity, typically 5-50
      tsne_n_iter: 1000  # int: t-SNE optimization iterations

    intra_disease:
      enabled: true  # bool: per-wavenumber Spearman correlations vs clinical targets, disease subjects only
      clinical_csv: "data/clinical_data.csv"  # str: disease-only curated clinical CSV
    robustness:
      enabled: false  # bool: compare baseline vs region-masked analyses
      suspect_windows: [[2655, 2685]]  # list[list[float]]: regions to downweight/exclude
      downweight_factor: 0.0  # float: 0 = exclude window, >0 = residual weight
    cross_range_report:
      enabled: true  # bool: generate fingerprint + CH-stretch joint report
      emit_html: true  # bool: also emit HTML version

# ---------------------------------------------------------------------------
# Whole-spectra band definitions (Movasaghi et al. 2007 + lab curation)
# ---------------------------------------------------------------------------
whole_spectra:
  bands:
    # dict[str, list[float]]: [start_cm, end_cm] integration windows
    phenylalanine_1004: [995, 1015]
    dna_po2_sym_1090: [1080, 1100]
    c_c_skeletal_1127: [1115, 1140]
    amide_iii_1260: [1240, 1280]
    ch2_bend_1300: [1290, 1320]
    ch2_scissor_1450: [1435, 1470]
    carboxylate_1580: [1565, 1595]
    amide_i_1655: [1630, 1680]
    ch2_sym_stretch_2850: [2840, 2865]
    ch2_asym_stretch_2885: [2875, 2900]
    ch3_sym_stretch_2930: [2920, 2945]
    ch3_asym_stretch_2960: [2950, 2975]
    oh_nh_stretch_3060: [3045, 3080]
  ratio_pairs:
    # list[list[str]]: band-name pairs for intensity-ratio calculations
    - [amide_i_1655, ch2_sym_stretch_2850]
    - [amide_i_1655, ch3_sym_stretch_2930]
    - [phenylalanine_1004, ch3_sym_stretch_2930]
    - [dna_po2_sym_1090, ch2_sym_stretch_2850]
    - [amide_iii_1260, amide_i_1655]
    - [ch2_sym_stretch_2850, ch3_sym_stretch_2930]
  correlation:
    method: "spearman"  # str: correlation method ("spearman", "pearson", ...)
    n_bootstrap: 200  # int: bootstrap replicates for confidence intervals
