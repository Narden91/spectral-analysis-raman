[project]
name = "eda-raman"
version = "0.1.0"
description = "Raman spectroscopy EDA/ML/DL analysis pipeline for EV characterization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.4.0",
    "markdown>=3.5",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyarrow>=21.0.0",
    "pybaselines>=1.2.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "scientific_validation: deterministic synthetic null/signal calibration checks",
]
filterwarnings = [
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]
notebook = [
    "dash>=4.0.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
gpu = [
    # CUDA 13.x wheels; matches driver CUDA UMD 13.x (RTX 5080). [ctk] bundles runtime libs.
    "cupy-cuda13x[ctk]>=14.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/manage_data_store.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = false
ignore_missing_imports = true
